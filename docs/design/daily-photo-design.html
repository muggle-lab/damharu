<style>
#daily-design{--dp-bg:light-dark(#f8f7f2,#242520);--dp-ink:light-dark(#30372e,#efeee6);--dp-muted:light-dark(#74786d,#b7b9ae);--dp-line:light-dark(#e4e5dc,#45483e);--dp-accent:light-dark(#54644a,#b9c9aa);--dp-on:light-dark(#fff,#24311d);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:var(--dp-ink)}
#daily-design *{box-sizing:border-box}#daily-design button{font:inherit;cursor:pointer}#daily-design .switcher{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-bottom:18px}#daily-design .switcher button{padding:10px 16px;border:0;border-radius:24px;background:var(--dp-bg);color:var(--dp-muted)}#daily-design .switcher button[aria-pressed=true]{background:var(--dp-accent);color:var(--dp-on)}#daily-design .phone{max-width:375px;margin:auto;border:1px solid var(--dp-line);border-radius:38px;background:var(--dp-bg);overflow:hidden;min-height:690px;padding:16px 23px 10px;position:relative}#daily-design .status{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:500;margin:0 3px 30px}#daily-design .status span:last-child{display:flex;gap:5px}#daily-design .status svg{width:14px;height:14px}#daily-design .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;min-height:44px}#daily-design h2{font-size:25px;letter-spacing:-1px;font-weight:500;margin:0}#daily-design .eyebrow{font-size:12px;color:var(--dp-muted);margin-bottom:7px}#daily-design .icon{border:0;background:transparent;color:var(--dp-ink);min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}#daily-design .week,#daily-design .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}#daily-design .week{margin-bottom:12px;color:var(--dp-muted);font-size:11px;text-align:center}#daily-design .day{aspect-ratio:.76;border:0;border-radius:7px;background:transparent;color:var(--dp-muted);font-size:12px;position:relative;padding:0;overflow:hidden}#daily-design .day span{position:absolute;top:5px;left:0;right:0;z-index:1}#daily-design .day.filled span{color:#fff;text-shadow:0 1px 4px #000}#daily-design .day.today{box-shadow:inset 0 0 0 1px var(--dp-accent);color:var(--dp-accent)}#daily-design .day:disabled{cursor:default}#daily-design .art{position:relative;overflow:hidden;width:100%;height:100%;background:#c6b59a}#daily-design .coffee{background:linear-gradient(120deg,#b6a58b,#e2d4b9 55%,#b4a18b)}#daily-design .coffee:before{content:'';position:absolute;width:49%;aspect-ratio:1;top:27%;left:23%;border-radius:50%;background:radial-gradient(circle,#b6804d 0 35%,#795338 36% 42%,#eee5d4 43% 55%,#d7cdb8 56% 62%,#efe6d5 63%);box-shadow:12px 17px 20px #59472d50}#daily-design .coffee:after{content:'';position:absolute;width:14%;height:17%;border:5px solid #e8ddc8;border-radius:40%;left:66%;top:43%}#daily-design .sky{background:linear-gradient(#97b7c4,#d9d7c4 65%,#829278 66%,#465f46)}#daily-design .sky:before{content:'';position:absolute;left:20%;top:22%;width:50%;height:13%;border-radius:50%;background:#f6f1e7a0;filter:blur(8px)}#daily-design .book{background:linear-gradient(145deg,#7d8d76,#bbc3a5)}#daily-design .book:before{content:'';position:absolute;width:65%;height:58%;left:18%;top:22%;background:linear-gradient(90deg,#ddd5bf,#faf1d9 48%,#bdb49e 50%,#eee5d1 53%,#dfd7bf);transform:rotate(-12deg);box-shadow:8px 12px 12px #28332240}#daily-design .sunset{background:linear-gradient(#ab9aaa,#e6b698 47%,#dbb586 59%,#77796f 60%,#3d5051)}#daily-design .sunset:before{content:'';width:17%;aspect-ratio:1;border-radius:50%;background:#ffdfb0;position:absolute;left:60%;top:36%}#daily-design .bottom{margin-top:36px}#daily-design .quiet{text-align:center;color:var(--dp-muted);font-size:13px;margin:22px 0}#daily-design .primary{background:var(--dp-accent);color:var(--dp-on);border:0;border-radius:17px;padding:17px;width:100%;font-size:15px;font-weight:500}#daily-design .primary:disabled{opacity:.45;cursor:default}#daily-design .homebar{width:110px;height:4px;border-radius:4px;background:var(--dp-ink);margin:26px auto 0;opacity:.7}#daily-design .preview{height:240px;border-radius:14px;overflow:hidden;margin-bottom:18px}#daily-design .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0 24px}#daily-design .tile{height:86px;border:0;padding:0;border-radius:9px;overflow:hidden;position:relative}#daily-design .tile[aria-pressed=true]{outline:3px solid var(--dp-accent);outline-offset:2px}#daily-design .tile[aria-pressed=true]:after{content:'✓';position:absolute;right:5px;bottom:5px;background:var(--dp-accent);color:var(--dp-on);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}#daily-design .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dp-muted)}#daily-design .detail-photo{height:370px;border-radius:3px;overflow:hidden;margin-top:10px}#daily-design .memo{background:transparent;border:0;color:var(--dp-muted);padding:20px 0;font-size:14px}#daily-design textarea{width:100%;background:transparent;border:1px solid var(--dp-line);border-radius:10px;padding:12px;color:var(--dp-ink);font:inherit;font-size:16px;resize:vertical}#daily-design [hidden]{display:none!important}#daily-design .sheet{padding:16px;border:1px solid var(--dp-line);border-radius:16px;background:var(--dp-bg);margin-top:12px}#daily-design .sheet button{display:block;background:transparent;border:0;padding:12px;color:var(--dp-ink);width:100%}#daily-design .empty{padding:64px 15px;text-align:center;color:var(--dp-muted)}
</style>
<div id="daily-design" aria-label="사진 일기 화면 시안">
<nav class="switcher" aria-label="시안 화면"><button data-screen="home" aria-pressed="true">01 홈 달력</button><button data-screen="pick" aria-pressed="false">02 사진 선택</button><button data-screen="detail" aria-pressed="false">03 기록 상세</button></nav>
<div class="phone"><div class="status"><span>9:41</span><span><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
<section data-page="home"><div class="top"><div><div class="eyebrow">나의 하루들</div><h2>2026년 9월</h2></div><button class="icon" id="settings" aria-label="설정"><i data-lucide="sliders-horizontal"></i></button></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="calendar" id="calendar"></div><div class="bottom"><p class="quiet" id="home-message">오늘, 기억하고 싶은 장면 하나.</p><button class="primary" id="add">오늘 한 장 남기기</button></div><div class="sheet" id="settings-panel" hidden><label><input type="checkbox"> 앱 잠금</label><p class="eyebrow">설정 화면 예시</p></div></section>
<section data-page="pick" hidden><div class="top"><button class="icon" data-back aria-label="뒤로"><i data-lucide="chevron-left"></i></button><span>오늘의 한 장</span><span style="width:44px"></span></div><div class="preview" id="preview"></div><div class="row"><span>9월 17일 · 오늘 찍은 사진</span><span>6장</span></div><div class="gallery" id="gallery"></div><button class="primary" id="save">이 사진으로 남기기</button></section>
<section data-page="detail" hidden><div class="top"><button class="icon" data-back aria-label="달력으로"><i data-lucide="chevron-left"></i></button><span id="detail-date">9월 12일 토요일</span><button class="icon" id="more" aria-label="기록 메뉴"><i data-lucide="ellipsis"></i></button></div><div class="detail-photo" id="detail-photo"></div><button class="memo" id="memo">한 줄 덧붙이기</button><div id="memo-edit" hidden><label class="eyebrow" for="note">그날의 한 줄</label><textarea id="note" rows="2" placeholder="기억하고 싶은 만큼만."></textarea><button class="memo" id="memo-save">저장</button></div><div class="sheet" id="record-menu" hidden><button id="change-photo">사진 바꾸기</button></div></section><div class="homebar"></div></div>
</div>
<script>
(()=>{const root=document.getElementById('daily-design');const $=s=>root.querySelector(s);let selected='coffee',saved=false,activeDay=12;const kinds=['coffee','sky','book','sunset','coffee','sky'];const records={1:'sky',3:'coffee',4:'book',6:'sunset',8:'coffee',9:'sky',12:'coffee',13:'book',15:'sunset',16:'sky'};const notes={};const design={roundness:7,empty:false,accent:'olive'};const art=k=>'<div class="art '+k+'" role="img" aria-label="'+({coffee:'커피',sky:'산책 풍경',book:'책',sunset:'노을'}[k])+' 예시 이미지"></div>';function show(name){root.querySelectorAll('[data-page]').forEach(e=>e.hidden=e.dataset.page!==name);root.querySelectorAll('[data-screen]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.screen===name)));}function calendar(){let html='<span></span><span></span>';for(let d=1;d<=30;d++){let k=design.empty?null:records[d];html+='<button class="day '+(k?'filled ':'')+(d===17?'today':'')+'" data-day="'+d+'" aria-label="9월 '+d+'일'+(k?' 기록 보기':'')+'" '+(!k&&d!==17?'disabled':'')+'>'+(k?art(k):'')+'<span>'+d+'</span></button>';}$('#calendar').innerHTML=html;root.querySelectorAll('.day').forEach(e=>e.style.borderRadius=design.roundness+'px');$('#home-message').textContent=saved?'오늘을 남겼어요.':design.empty?'사진 한 장이면, 오늘의 기록은 끝.':'오늘, 기억하고 싶은 장면 하나.';$('#add').textContent=saved?'오늘의 사진 보기':'오늘 한 장 남기기';}function picker(){$('#preview').innerHTML=art(selected);$('#gallery').innerHTML=kinds.map((k,i)=>'<button class="tile" data-photo="'+i+'" aria-label="'+k+' 사진 선택" aria-pressed="'+(i===kinds.indexOf(selected))+'">'+art(k)+'</button>').join('');}function detail(d){activeDay=d;$('#detail-date').textContent='9월 '+d+'일 '+['일','월','화','수','목','금','토'][new Date(2026,8,d).getDay()]+'요일';$('#detail-photo').innerHTML=art(records[d]||selected);$('#memo').textContent=notes[d]||'한 줄 덧붙이기';$('#note').value=notes[d]||'';$('#memo-edit').hidden=true;$('#memo').hidden=false;show('detail');}root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen){if(b.dataset.screen==='detail')detail(saved?17:12);else{if(b.dataset.screen==='pick')activeDay=17;show(b.dataset.screen);}}if(b.hasAttribute('data-back'))show('home');if(b.dataset.day){const d=Number(b.dataset.day);if(records[d]&&!design.empty)detail(d);else{activeDay=d;show('pick');}}if(b.dataset.photo!==undefined){selected=kinds[Number(b.dataset.photo)];picker();} });$('#add').onclick=()=>{if(saved)detail(17);else{activeDay=17;show('pick');}};$('#save').onclick=()=>{records[activeDay]=selected;if(activeDay===17)saved=true;design.empty=false;calendar();show('home');};$('#memo').onclick=()=>{$('#memo-edit').hidden=false;$('#memo').hidden=true;$('#note').focus();};$('#memo-save').onclick=()=>{notes[activeDay]=$('#note').value;detail(activeDay);};$('#more').onclick=()=>$('#record-menu').hidden=!$('#record-menu').hidden;$('#change-photo').onclick=()=>{$('#record-menu').hidden=true;show('pick');};$('#settings').onclick=()=>$('#settings-panel').hidden=!$('#settings-panel').hidden;function render(){root.style.setProperty('--dp-accent',design.accent==='olive'?'light-dark(#54644a,#b9c9aa)':'light-dark(#766353,#d1b79f)');calendar();}picker();render();$('#detail-photo').innerHTML=art('coffee');if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addSelect(design,'accent',{label:'포인트 색',options:[{label:'올리브',value:'olive'},{label:'모카',value:'mocha'}]});t.addSlider(design,'roundness',{label:'달력 사진 모서리',min:0,max:16,unit:'px'});t.addToggle(design,'empty',{label:'처음 사용하는 날'});}})();
</script>
