<style>
#filter-diary{--fd-bg:light-dark(#f8f7f2,#242520);--fd-ink:light-dark(#30372e,#efeee6);--fd-muted:light-dark(#73776c,#b7b9ae);--fd-line:light-dark(#e2e3da,#46483f);--fd-accent:light-dark(#54644a,#b9c9aa);--fd-on:light-dark(#fff,#24311d);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:var(--fd-ink)}
#filter-diary *{box-sizing:border-box}#filter-diary button,#filter-diary input{font:inherit}#filter-diary button{cursor:pointer}#filter-diary .fd-phone{max-width:390px;margin:auto;background:var(--fd-bg);border:1px solid var(--fd-line);border-radius:36px;padding:17px 22px 10px;overflow:hidden}#filter-diary .fd-status{display:flex;justify-content:space-between;font-size:12px;margin:0 5px 22px;font-weight:500}#filter-diary .fd-status span:last-child{display:flex;gap:5px}#filter-diary .fd-status svg{width:14px;height:14px}#filter-diary .fd-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}#filter-diary .fd-heading{text-align:center}#filter-diary .fd-heading strong{display:block;font-size:16px;font-weight:500}#filter-diary .fd-heading small{display:block;font-size:11px;margin-top:5px;color:var(--fd-muted)}#filter-diary .fd-icon{background:transparent;border:0;color:var(--fd-ink);width:44px;height:44px;display:grid;place-items:center}#filter-diary .fd-photo{aspect-ratio:4/5;position:relative;overflow:hidden;border-radius:4px;background:#c8b89e}#filter-diary .fd-scene{width:100%;height:100%;position:relative;overflow:hidden;background:linear-gradient(122deg,#afa38d,#e7dac2 55%,#baa78d)}#filter-diary .fd-scene:before{content:'';position:absolute;top:31%;left:17%;width:61%;aspect-ratio:1;border-radius:50%;background:radial-gradient(ellipse at 47% 46%,#b98455 0 31%,#735034 33% 36%,#eee7d8 37% 48%,#cdc2ac 50% 52%,#f0e6d5 54% 63%,#c9bba2 65% 67%,transparent 69%);filter:drop-shadow(13px 18px 8px #58472d50)}#filter-diary .fd-scene:after{content:'';position:absolute;left:69%;top:48%;width:12%;height:12%;border:6px solid #e8dece;border-radius:40%;transform:rotate(-12deg);box-shadow:5px 8px 9px #58472d30}#filter-diary .fd-window{position:absolute;width:130%;height:30%;background:#fff5cf44;transform:rotate(-37deg);top:2%;left:-35%;box-shadow:0 25px 0 #5d584c12,0 110px 0 #fff5cf33}#filter-diary .fd-compare{position:absolute;right:11px;bottom:11px;display:flex;align-items:center;gap:6px;min-height:44px;padding:8px 12px;background:light-dark(#f8f7f2ed,#242520ed);border:0;border-radius:24px;color:var(--fd-ink);font-size:12px}#filter-diary .fd-compare svg{width:15px;height:15px}#filter-diary .fd-filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-top:22px}#filter-diary .fd-filter{background:transparent;border:0;padding:0;color:var(--fd-muted);min-width:0;font-size:12px}#filter-diary .fd-thumb{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;margin-bottom:9px}#filter-diary .fd-filter[aria-pressed=true]{color:var(--fd-accent);font-weight:500}#filter-diary .fd-filter[aria-pressed=true] .fd-thumb{outline:2px solid var(--fd-accent);outline-offset:3px}#filter-diary .fd-adjust{min-height:83px;padding-top:21px}#filter-diary .fd-range-label{display:flex;justify-content:space-between;font-size:12px;color:var(--fd-muted)}#filter-diary input[type=range]{width:100%;accent-color:var(--fd-accent);height:30px;margin:4px 0 0}#filter-diary .fd-original{text-align:center;font-size:12px;color:var(--fd-muted);margin:9px 0 0}#filter-diary .fd-primary{width:100%;padding:17px 8px;border:0;border-radius:17px;background:var(--fd-accent);color:var(--fd-on);font-size:15px;font-weight:500;min-height:52px}#filter-diary .fd-bar{width:110px;height:4px;background:var(--fd-ink);opacity:.7;border-radius:4px;margin:24px auto 0}#filter-diary .fd-result{text-align:center;padding-top:17px}#filter-diary .fd-result h2{font-size:22px;font-weight:500;margin:20px 0 9px;letter-spacing:-.6px}#filter-diary .fd-result p{font-size:13px;color:var(--fd-muted);margin:0 0 27px}#filter-diary .fd-result-photo{width:76%;aspect-ratio:4/5;margin:20px auto 0;overflow:hidden;border:8px solid light-dark(#fff,#35372f);transform:rotate(-3deg);box-shadow:0 10px 25px #00000012}#filter-diary .fd-sheet{border:1px solid var(--fd-line);border-radius:16px;padding:15px;margin-bottom:16px;background:var(--fd-bg)}#filter-diary .fd-sheet button{display:block;width:100%;background:transparent;color:var(--fd-ink);border:0;padding:12px;font-size:14px}#filter-diary [hidden]{display:none!important}
</style>
<div id="filter-diary" aria-label="사진 확정 후 필터 화면">
<div class="fd-phone"><div class="fd-status"><span>9:41</span><span><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
<section id="fd-edit"><div class="fd-head"><button class="fd-icon" id="fd-back" aria-label="사진 다시 선택"><i data-lucide="chevron-left"></i></button><div class="fd-heading"><strong>오늘의 한 장</strong><small>9월 17일 목요일</small></div><span style="width:44px"></span></div>
<div class="fd-sheet" id="fd-source" hidden><button id="fd-album">사진 다시 고르기</button><button id="fd-camera">다시 촬영하기</button><button id="fd-keep">이 사진 계속 사용</button></div>
<div class="fd-photo"><div class="fd-scene" id="fd-main" role="img" aria-label="커피 한 잔 예시 이미지"><span class="fd-window"></span></div><button class="fd-compare" id="fd-compare" aria-pressed="false" hidden><i data-lucide="square-split-horizontal" aria-hidden="true"></i><span>원본 비교</span></button></div>
<div class="fd-filters" id="fd-filters" aria-label="사진 필터"></div>
<div class="fd-adjust"><p class="fd-original" id="fd-original">지금 모습 그대로 남겨도 좋아요.</p><div id="fd-slider" hidden><label class="fd-range-label" for="fd-strength"><span>필터 강도</span><output id="fd-value">60</output></label><input id="fd-strength" type="range" min="0" max="100" value="60" aria-label="필터 강도"></div></div>
<button class="fd-primary" id="fd-save">이대로 남기기</button></section>
<section class="fd-result" id="fd-result" aria-live="polite" hidden><div class="fd-heading"><small>2026년 9월 17일</small></div><div class="fd-result-photo" id="fd-result-photo"></div><h2>오늘을 남겼어요.</h2><p>사진 한 장에 담아둔 나의 하루.</p><button class="fd-primary" id="fd-edit-again">사진 다시 보기</button></section>
<div class="fd-bar"></div></div></div>
<script>
(()=>{const root=document.getElementById('filter-diary'),q=s=>root.querySelector(s);const filters=[{id:'original',name:'원본'},{id:'warm',name:'온기'},{id:'clear',name:'맑음'},{id:'film',name:'필름'},{id:'mono',name:'흑백'}];let chosen='original',strength=60,compare=false;const options={radius:4,start:'original'};const scene='<div class="fd-scene"><span class="fd-window"></span></div>';function effect(id,value){const t=value/100;switch(id){case 'warm':return `sepia(${.3*t}) saturate(${1+.15*t}) brightness(${1+.04*t})`;case 'clear':return `saturate(${1+.2*t}) brightness(${1+.12*t}) contrast(${1+.08*t})`;case 'film':return `sepia(${.28*t}) saturate(${1-.35*t}) contrast(${1-.16*t}) brightness(${1+.06*t})`;case 'mono':return `grayscale(${t}) contrast(${1+.08*t})`;default:return 'none';}}q('#fd-filters').innerHTML=filters.map(f=>`<button class="fd-filter" data-filter="${f.id}" aria-pressed="${f.id===chosen}"><span class="fd-thumb" style="filter:${effect(f.id,100)}">${scene}</span>${f.name}</button>`).join('');function render(){q('#fd-main').style.filter=effect(compare?'original':chosen,strength);q('#fd-original').hidden=chosen!=='original';q('#fd-slider').hidden=chosen==='original';q('#fd-compare').hidden=chosen==='original';q('#fd-compare').setAttribute('aria-pressed',String(compare));q('#fd-compare span').textContent=compare?'필터로 돌아가기':'원본 비교';q('#fd-value').value=String(strength);q('#fd-strength').value=String(strength);q('#fd-save').textContent=chosen==='original'?'이대로 남기기':'이 사진으로 남기기';root.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===chosen)));q('.fd-photo').style.borderRadius=options.radius+'px';}q('#fd-filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;chosen=b.dataset.filter;compare=false;render();};q('#fd-strength').oninput=e=>{strength=Number(e.target.value);compare=false;render();};q('#fd-compare').onclick=()=>{compare=!compare;render();};q('#fd-save').onclick=()=>{q('#fd-result-photo').innerHTML=scene;q('#fd-result-photo .fd-scene').style.filter=effect(chosen,strength);q('#fd-edit').hidden=true;q('#fd-result').hidden=false;};q('#fd-edit-again').onclick=()=>{q('#fd-edit').hidden=false;q('#fd-result').hidden=true;compare=false;render();};q('#fd-back').onclick=()=>q('#fd-source').hidden=!q('#fd-source').hidden;q('#fd-keep').onclick=()=>q('#fd-source').hidden=true;['#fd-album','#fd-camera'].forEach(id=>q(id).onclick=()=>{q('#fd-source').hidden=true;chosen='original';compare=false;render();});render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{chosen=options.start;compare=false;render();}});tweak.addSlider(options,'radius',{label:'사진 모서리',min:0,max:24,unit:'px'});tweak.addSelect(options,'start',{label:'필터 상태 미리보기',options:filters.map(f=>({label:f.name,value:f.id}))});}})();
</script>
