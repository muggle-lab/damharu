const grid=root.querySelector('.samples');
films.forEach(f=>{const fig=document.createElement('figure');const c=document.createElement('canvas');c.setAttribute('role','img');c.setAttribute('aria-label',f.name+' 필름 적용 예시');const cap=document.createElement('figcaption');cap.textContent=f.name;const d=document.createElement('div');d.className='detail text-small';d.textContent=f.desc;fig.append(c,cap,d);grid.append(fig)});
let serial=0;
function render(url,label){const token=++serial;const img=new Image();img.onload=()=>{if(token!==serial)return;const w=360,h=Math.round(w*img.height/img.width);const base=document.createElement('canvas');base.width=w;base.height=h;const ctx=base.getContext('2d');ctx.drawImage(img,0,0,w,h);const src=ctx.getImageData(0,0,w,h);grid.querySelectorAll('canvas').forEach((c,n)=>{c.width=w;c.height=h;const out=c.getContext('2d');const data=out.createImageData(w,h),f=films[n],m=f.matrix;let seed=7;for(let i=0;i<src.data.length;i+=4){const x=(i/4)%w,y=Math.floor(i/4/w);const r=src.data[i],g=src.data[i+1],b=src.data[i+2];seed=(Math.imul(seed,1664525)+1013904223)>>>0;const noise=seed/4294967296-.5;const a=Math.abs(noise)*f.g;const v=Math.min(1,Math.hypot(x-w/2,y-h/2)/(Math.max(w,h)*.72))*f.v;for(let j=0;j<3;j++){const k=j*5;const col=Math.min(255,Math.max(0,r*m[k]+g*m[k+1]+b*m[k+2]+m[k+4]));data.data[i+j]=col*(1-v)*(1-a)+(noise>0?255:0)*a}data.data[i+3]=255}out.putImageData(data,0,0)});root.querySelector('#film-status').textContent=label};img.onerror=()=>{root.querySelector('#film-status').textContent='사진을 읽을 수 없습니다. JPG 또는 PNG로 다시 선택해 주세요.'};img.src=url}
root.querySelector('input').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>render(reader.result,'내 사진 · 이 비교 화면 안에서만 처리');reader.readAsDataURL(file)});
root.querySelector('#film-reset').addEventListener('click',()=>{root.querySelector('input').value='';render(sample,'기존 스플래시 시안 · 색감 비교용')});render(sample,'기존 스플래시 시안 · 색감 비교용');
})();
